services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: asteroids
      MONGO_INITDB_ROOT_PASSWORD: asteroids
      MONGO_INITDB_DATABASE: asteroids
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: asteroids
      ME_CONFIG_MONGODB_ADMINPASSWORD: asteroids
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin


  # ---------- мікросервіси (docker compose --profile full up --build) ----------
  # Типово (без профілю) піднімається лише база — для розробки сервіси запускає `npm run dev` у server/.
  auth:
    build: ./server
    image: asteroids-server
    profiles: [full]
    restart: unless-stopped
    command: node dist/services/auth.js
    depends_on: [mongo]
    environment:
      PORT: '8801'
      MONGO_URI: mongodb://asteroids:asteroids@mongo:27017/asteroids?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      GAME_TICKET_SECRET: ${GAME_TICKET_SECRET:-dev-game-ticket-secret-change-me}
      SERVICE_AUTH_URL: http://auth:8801
      SERVICE_PROFILE_URL: http://profile:8802
      SERVICE_SHOP_URL: http://shop:8803
      SERVICE_CRATES_URL: http://crates:8804
      SERVICE_STATS_URL: http://stats:8805
      SERVICE_SOCIAL_URL: http://social:8806
      SERVICE_MATCHMAKER_URL: http://matchmaker:8807

  profile:
    build: ./server
    image: asteroids-server
    profiles: [full]
