services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: asteroids
      MONGO_INITDB_ROOT_PASSWORD: asteroids
      MONGO_INITDB_DATABASE: asteroids
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: asteroids
      ME_CONFIG_MONGODB_ADMINPASSWORD: asteroids
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

volumes:
  mongo-data:
